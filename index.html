/* Refined monochrome administration UI */
:root{--bg:#f7f7f5;--ink:#20201f;--muted:#777773;--line:#e5e4e0;--soft:#f1f0ed;--danger:#20201f;--focus:#20201f}

const PURE_TOK=/^(?:(?:\d{1,3}|[①②③④⑤])\s*)+$/;
const akTable=(items,n,shortFn,lo)=>{lo=lo||1;const toks=[];items.forEach(it=>{const t=String(it.str||"").trim();if(!t||!PURE_TOK.test(t))return;(t.match(/\d{1,3}|[①②③④⑤]/g)).forEach((p,i)=>toks.push({s:p,x:it.transform[4]+i*0.01,y:it.transform[5]}))});toks.sort((a,b)=>b.y-a.y||a.x-b.x);const rows=[];toks.forEach(t=>{const r=rows[rows.length-1];if(r&&Math.abs(r.y-t.y)<3)r.t.push(t);else rows.push({y:t.y,t:[t]})});rows.forEach(r=>r.t.sort((a,b)=>a.x-b.x));const gaps=[];rows.forEach(r=>{for(let j=1;j<r.t.length;j++)if(CIRC[r.t[j].s]&&/^\d{1,2}$/.test(r.t[j-1].s))gaps.push(r.t[j].x-r.t[j-1].x)});gaps.sort((a,b)=>a-b);const lim=gaps.length?gaps[gaps.length>>1]*1.6:45;const map=new Map();let dup=false,over=0;rows.forEach(r=>{const tk=r.t;const pairs=[];for(let j=0;j<tk.length-1;){const q=tk[j],a=tk[j+1];if(/^\d{1,2}$/.test(q.s)&&Number(q.s)>=1&&Number(q.s)<=60&&a.x-q.x<lim&&a.x>q.x){const k=Number(q.s);if(shortFn(k)){if(/^\d{1,3}$/.test(a.s)){pairs.push([k,a.s]);j+=2;continue}}else if(CIRC[a.s]){pairs.push([k,CIRC[a.s]]);j+=2;continue}}j++}pairs.forEach(([k,v])=>{if(k>n)over++;else if(k>=lo){if(map.has(k))dup=true;map.set(k,v)}})});if(!map.size)return {err:"정답표를 찾지 못하였습니다."};if(dup)return {err:"정답표에 같은 번호가 여러 번 나타나 정답을 확정할 수 없습니다."};if(over)return {err:`정답표에 입력한 문항 수(${n}개)보다 큰 번호가 있습니다.`};const out=[];let miss=0;for(let k=lo;k<=n;k++){if(map.has(k))out.push(map.get(k));else if(shortFn(k)){out.push("");miss++}else return {err:`${k}번 문항의 정답을 읽지 못하여 정답표를 확정할 수 없습니다.`}}return {out,miss}};
const akHeaderCheck=(items,sel)=>{const txt=items.map(i=>String(i.str||"")).join(" ").replace(/\s+/g," ");const m=txt.match(/(\d{4})\s*학년도\s*(\d{1,2})\s*월\s*(?:대학수학능력시험\s*)?(?:고\s*([123]))?/),a=txt.match(/(국어|수학|영어|사회탐구|과학탐구)\s*영역/);if(m){if(m[1]!==sel.year)return `파일의 학년도(${m[1]}학년도)가 선택한 학년도(${sel.year}학년도)와 다릅니다.`;if(Number(m[2])!==sel.month)return `파일의 시행 월(${m[2]}월)이 선택한 시험(${sel.month}월)과 다릅니다.`;if(m[3]&&m[3]!==sel.grade)return `파일의 학년(고${m[3]})이 선택한 학년(${sel.grade}학년)과 다릅니다.`}if(a&&`${a[1]} 영역`!==sel.area)return `파일의 영역(${a[1]} 영역)이 선택한 영역(${sel.area})과 다릅니다.`;return ""};
const compactTxt=t=>String(t||"").replace(/\s+/g,"");
const splitVariantWindows=items=>{const names=Object.values(VARIANT_INFO).flatMap(v=>v.list);const heads=[];items.forEach(it=>{let c=compactTxt(it.str);if(!c.startsWith("["))return;if(!c.includes("]")){const nx=items.filter(o=>o!==it&&Math.abs(o.transform[5]-it.transform[5])<3&&o.transform[4]>it.transform[4]).sort((p,q)=>p.transform[4]-q.transform[4])[0];if(nx)c+=compactTxt(nx.str)}const nm=names.find(v=>c.includes("["+compactTxt(v)+"]"));if(nm)heads.push({name:nm,x:it.transform[4],y:it.transform[5]})});const wins=new Map(),rest=[];items.forEach(it=>{const t=String(it.str||"").trim();if(!t||!PURE_TOK.test(t)){return}let best=null;heads.forEach(h=>{const dy=h.y-it.transform[5];const dx=it.transform[4]-h.x;if(dy>0&&dy<70&&dx>=-90&&dx<=160&&(!best||dy<best.dy))best={h,dy}});if(best){if(!wins.has(best.h.name))wins.set(best.h.name,[]);wins.get(best.h.name).push(it)}else rest.push(it)});return {heads,wins,rest}};
const loadPdfJs=()=>window.pdfjsLib?Promise.resolve(window.pdfjsLib):new Promise((ok,no)=>{const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";sc.onload=()=>{if(!window.pdfjsLib)return no(Error("PDF 읽기 기능을 불러오지 못하였습니다."));window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok(window.pdfjsLib)};sc.onerror=()=>no(Error("PDF 읽기 기능을 불러오지 못하였습니다. 인터넷 연결을 확인하여 주시기 바랍니다."));document.head.appendChild(sc)});
const readAnswerPdf=async(buf,sel,n)=>{const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;const pages=[];for(let p=1;p<=Math.min(8,doc.numPages);p++){const items=(await (await doc.getPage(p)).getTextContent()).items;if(p===1){const bad=akHeaderCheck(items,sel);if(bad)throw Error(bad)}pages.push(items)}const shortFn=k=>isMathShort(sel.year,sel.area,k-1,sel.grade);const vi=hasVariants(sel.year,sel.grade,sel.area)?VARIANT_INFO[sel.area]:null;let lastErr="정답표를 찾지 못하였습니다.";if(!vi){for(const items of pages){const r=akTable(items,n,shortFn,1);if(r.out)return {plain:r.out,miss:r.miss};if(r.err&&r.err!=="정답표를 찾지 못하였습니다.")lastErr=r.err}throw Error(lastErr)}const C=vi.from-1;if(n!==Math.max(C,0)+ (sel.area==="수학 영역"?8:11))throw Error("문항 수가 선택과목이 있는 시험의 구성과 다릅니다.");const vOut={};let common=null;for(const items of pages){const w=splitVariantWindows(items);for(const [name,its] of w.wins){const r=akTable(its,n,shortFn,vi.from);if(r.out){if(vOut[name])throw Error("선택과목별 정답표가 중복되어 정답을 확정할 수 없습니다.");vOut[name]={out:r.out,miss:r.miss}}else if(r.err)lastErr=`${name}: ${r.err}`}if(!common){const r=akTable(w.rest,C,shortFn,1);if(r.out)common=r}else if(akTable(w.rest,C,shortFn,1).out)throw Error("공통 문항의 정답표가 중복되어 정답을 확정할 수 없습니다.")}const miss=vi.list.filter(v=>!vOut[v]);if(!common||miss.length)throw Error(!common?lastErr:`선택과목(${miss.join(", ")})의 정답표를 찾지 못하였습니다. ${lastErr}`);const variants={};vi.list.forEach(v=>{variants[v]={out:common.out.concat(vOut[v].out),miss:common.miss+vOut[v].miss}});return {variants}};
const readPaperPdf=async(buf,sel,n)=>{const lib=await loadPdfJs();const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;const pages=[];for(let p=1;p<=Math.min(40,doc.numPages);p++){const pg=await doc.getPage(p);const items=(await pg.getTextContent()).items;if(p===1){const bad=akHeaderCheck(items,sel);if(bad)throw Error(bad)}pages.push({w:pg.view[2]-pg.view[0],items})}const r=paperPoints(pages,n,k=>isMathShort(sel.year,sel.area,k-1,sel.grade),sel.area==="수학 영역");if(r.pts)return r.pts;throw Error(r.err)};

async function ingestAnswerPdf(file,meta){const area={korean:"국어 영역",math:"수학 영역",english:"영어 영역"}[meta.subjectArea];const kind=meta.category;if((kind!=="answer"&&kind!=="paper")||!/\.pdf$/i.test(file.name)||!area)return null;const n=area==="수학 영역"?30:45;const sel={year:meta.academicYear,grade:meta.schoolGrade,month:parseInt(meta.examType,10),area};const base={year:meta.academicYear,grade:meta.schoolGrade,examType:meta.examType,area};const hv=hasVariants(sel.year,sel.grade,area);try{if(kind==="answer"){const res=await readAnswerPdf(await file.arrayBuffer(),sel,n);const sets=res.variants?Object.entries(res.variants).map(([v,o])=>({v,out:o.out,miss:o.miss})):[{v:"",out:res.plain,miss:res.miss}];const cnt={saved:0,draft:0,same:0,conflict:0};let miss=0;for(const x of sets){const d=await call("auto_answer_key",{...base,variant:x.v,answers:x.out});cnt[d.status]=(cnt[d.status]||0)+1;miss=Math.max(miss,x.miss||0)}const parts=[];if(cnt.saved)parts.push(`${cnt.saved}건 저장`);if(cnt.draft)parts.push(`${cnt.draft}건 편집 대기로 저장`);if(cnt.same)parts.push(`${cnt.same}건 이미 같은 정답이 등록되어 있음`);if(cnt.conflict)parts.push(`${cnt.conflict}건 이미 등록된 정답과 달라 저장하지 않음`);let msg=`정답을 자동으로 읽었습니다(${parts.join(", ")}).`;if(miss)msg+=` 주관식 ${miss}개 문항의 정답은 파일에서 읽을 수 없어 비워 두었으니 정답 관리에서 입력하여 주시기 바랍니다.`;else if(cnt.draft)msg+=" 정답 관리에서 배점을 등록하여 주시기 바랍니다.";return {ok:!cnt.conflict,msg}}if(hv)return {ok:true,msg:"선택과목이 있는 시험은 문제지의 배점을 자동으로 읽지 않습니다. 정답 관리에서 배점을 등록하여 주시기 바랍니다."};const pts=await readPaperPdf(await file.arrayBuffer(),sel,n);const d=await call("auto_points",{...base,variant:"",points:pts});if(d.status==="saved")return {ok:true,msg:"문제지에서 배점을 자동으로 읽어 저장하였습니다."};if(d.status==="points_only")return {ok:true,msg:"문제지에서 배점을 자동으로 읽어 편집 대기로 저장하였습니다. 정답 및 해설 파일을 업로드하거나 정답 관리에서 정답을 등록하여 주시기 바랍니다."};if(d.status==="same")return {ok:true,msg:"이미 같은 배점이 등록되어 있습니다."};return {ok:false,msg:"이미 등록된 배점과 문제지의 배점이 달라 자동으로 저장하지 않았습니다. 정답 관리에서 확인하여 주시기 바랍니다."}}catch(e){return {ok:false,msg:`${kind==="answer"?"정답":"배점"}을 function statsView(){

const sittings=new Map();scores.forEach(sc=>{const i=info(sc.subject);if(!sittings.has(i.key))sittings.set(i.key,{...i,items:[]});sittings.get(i.key).items.push(sc)});

const okAns=(it,v)=>String(it.ans).split(",").map(x=>x.trim()).includes(v);
const paint=()=>{const s=sittings.get($("stSel").value);const byArea=new Map();s.items.forEach(sc=>{const a=resultParts(sc.subject).subject;if(!byArea.has(a))byArea.set(a,[]);byArea.get(a).push(sc)});const cards=[...byArea].sort((a,b)=>areaRank(a[0])-areaRank(b[0])).map(([area,items0])=>{const items=items0.filter(x=>!isAbsRow(x));const absentN=items0.length-items.length;const nums=items.map(x=>Number(x.score)).filter(Number.isFinite);if(!nums.length)return "";const n=nums.length;const mean=nums.reduce((p,c)=>p+c,0)/n;const sd=Math.sqrt(nums.reduce((p,c)=>p+(c-mean)**2,0)/n);const srt=nums.slice().sort((a,b)=>a-b);const med=n%2?srt[(n-1)/2]:(srt[n/2-1]+srt[n/2])/2;const mx=["사회탐구 영역","과학탐구 영역"].includes(area)?50:100,w=mx/10;const bins=Array(10).fill(0);nums.forEach(v=>{bins[Math.min(9,Math.floor(v/w))]++});const bmax=Math.max(...bins,1);const gd=new Map();items.forEach(sc=>{const g=expectedGrade(sc);gd.set(g,(gd.get(g)||0)+1)});const gradeKeys=[...gd.keys()].sort((a,b)=>{const na=parseInt(a)||99,nb=parseInt(b)||99;return na-nb});const hist=`<div class="hist">${bins.map((c,i)=>`<div class="hbar" title="${i*w}~${i===9?mx:(i+1)*w-0.1}점: ${c}명"><i style="height:${Math.round(c/bmax*100)}%"></i><b>${c||""}</b><span>${i*w}</span></div>`).join("")}</div>`;const keysHere=answerKeys.filter(k=>{const p=resultParts(items[0].subject);return String(k.academic_year)===p.year&&String(k.school_grade)===String(p.schoolGrade)&&k.exam_type===p.event&&k.area===area&&keyDone(k)});const qa=keysHere.map(k=>{const v=String(k.variant||"");const gr=items.filter(sc=>sc.answers&&String(sc.answers.variant||"")===v);if(!gr.length)return "";let susN=0;const cells=k.items.map((it,i)=>{let right=0,tot=0;const wrong=new Map();gr.forEach(sc=>{const g=String((sc.answers.a||[])[i]||"");tot++;if(g&&okAns(it,g))right++;else{const key=g||"무응답";wrong.set(key,(wrong.get(key)||0)+1)}});const rate=tot?Math.round(right/tot*100):0;const top=[...wrong].sort((a,b)=>b[1]-a[1])[0];const sus=!!top&&top[0]!=="무응답"&&tot>=3&&rate<40&&top[1]/tot>=0.5;if(sus)susN++;return `<div class="q-cell${rate<40?" low":""}${sus?" suspect":""}"><span class="qn">${i+1}</span><div class="qbar"><i style="width:${rate}%"></i></div><span class="qr">${rate}%</span><span class="qw">${top?`오답 최다 ${top[0]==="무응답"?"무응답":esc(top[0])+(isMathShort(k.academic_year,area,i,k.school_grade)||String(it.ans).split(",").some(x=>x.trim().length>1)?"":"번")} (${top[1]}명)`:"오답 없음"}${sus?'<b class="qsus">정답 등록 확인 필요</b>':""}</span></div>`}).join("");return `<details class="q-analysis"${susN?" open":""}><summary>문항별 정답률 (채점 ${gr.length}명${susN?`, 정답 확인 필요 ${susN}문항`:""})</summary><div class="q-grid">${cells}</div></details>`}).join("");return `<section class="stat-card"><h3>${esc(area)}<span>응시 ${n}명${absentN?`, 미응시 ${absentN}명`:""}</span></h3><div class="stat-nums"><div><span>평균</span><strong>${fmt(Math.round(mean*10)/10)}</strong></div><div><span>표준편차</span><strong>${fmt(Math.round(sd*10)/10)}</strong></div><div><span>중앙값</span><strong>${fmt(med)}</strong></div><div><span>최고</span><strong>${fmt(srt[n-1])}</strong></div><div><span>최저</span><strong>${fmt(srt[0])}</strong></div></div><div class="stat-sub">점수 분포 (${w}점 단위)</div>${hist}<div class="stat-sub">등급 분포</div><div class="grade-dist">${gradeKeys.map(g=>`<span><b>${esc(g==="—"?"미산정":g)}</b>${gd.get(g)}명</span>`).join("")}</div>${qa}</section>`}).join("");$("stBody").innerHTML=cards?`<div class="stat-grid">${cards}</div>`:'<div class="empty">표시할 성적이 없습니다.</div>'};
paint();$("stSel").onchange=paint}
